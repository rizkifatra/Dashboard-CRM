# ====================================
# COMMON CONFIGURATION (All Environments)
# ====================================
server.port=8080
spring.application.name=d365-dashboard

# Active Profile - Change this to switch environments
# Options: dev, prod
spring.profiles.active=dev

# Actuator (for health checks)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Dynamics 365 API configuration
d365.api.base-url=https://bintarasolutions.crm5.dynamics.com/api/data/v9.2
d365.api.scope=https://bintarasolutions.crm5.dynamics.com/.default
d365.api.timeout=30000

# Azure AD configuration for Dynamics 365 API authentication
azure.ad.tenant-id=${D365_TENANT_ID:your-tenant-id}
azure.ad.client-id=${D365_CLIENT_ID:your-client-id}
azure.ad.client-secret=${D365_CLIENT_SECRET:your-client-secret}

# Internal email detection configuration
# Comma-separated list of internal domains (case-insensitive, matched by endsWith)
d365.api.internal-domains=@bintara.com.my
# Comma-separated list of known shared mailboxes (exact match, case-insensitive)
d365.api.internal-shared-mailboxes=support@bintara.com.my,mtr@bintara.com.my

# OAuth2 / Security Configuration
spring.security.oauth2.client.registration.azure.client-id=${AZURE_CLIENT_ID:your-client-id}
spring.security.oauth2.client.registration.azure.client-secret=${AZURE_CLIENT_SECRET:your-client-secret}
spring.security.oauth2.client.registration.azure.scope=openid,profile,email,https://bintarasolutions.crm5.dynamics.com/user_impersonation
spring.security.oauth2.client.registration.azure.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.azure.client-name=Microsoft
spring.security.oauth2.client.registration.azure.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.azure.client-authentication-method=client_secret_post

spring.security.oauth2.client.provider.azure.authorization-uri=https://login.microsoftonline.com/b54af29e-7225-44f6-8f90-c592bb23d426/oauth2/v2.0/authorize
spring.security.oauth2.client.provider.azure.token-uri=https://login.microsoftonline.com/b54af29e-7225-44f6-8f90-c592bb23d426/oauth2/v2.0/token
spring.security.oauth2.client.provider.azure.user-info-uri=https://graph.microsoft.com/oidc/userinfo
spring.security.oauth2.client.provider.azure.jwk-set-uri=https://login.microsoftonline.com/b54af29e-7225-44f6-8f90-c592bb23d426/discovery/v2.0/keys
spring.security.oauth2.client.provider.azure.user-name-attribute=preferred_username

# JWT Configuration
jwt.secret=${JWT_SECRET:your-very-long-secret-key-min-256-bits-for-hs256-algorithm-please-change-this-in-production}
jwt.expiration=86400000

# Frontend URL (for OAuth2 redirect)
app.frontend-url=${FRONTEND_URL:http://localhost:4200}
