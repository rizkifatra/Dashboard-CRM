# ====================================
# PRODUCTION ENVIRONMENT CONFIGURATION
# ====================================
# This file is used when spring.profiles.active=prod
# Uses environment variables for security - DO NOT hardcode secrets here

# Server Configuration - Trust proxy headers from nginx
server.forward-headers-strategy=framework

# Session cookie configuration for HTTPS
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true

# Azure AD Configuration - From Environment Variables
azure.ad.tenant-id=${AZURE_TENANT_ID}
azure.ad.client-id=${AZURE_CLIENT_ID}
azure.ad.client-secret=${AZURE_CLIENT_SECRET}
azure.ad.authority=https://login.microsoftonline.com/${azure.ad.tenant-id}

# Override redirect-uri to use explicit FRONTEND_URL for Azure deployment
spring.security.oauth2.client.registration.azure.redirect-uri=${FRONTEND_URL}/login/oauth2/code/azure

# Dynamics 365 Configuration - From Environment Variables
d365.api.base-url=${D365_BASE_URL}
d365.api.scope=${D365_SCOPE}
d365.api.timeout=30000

# Production Logging - Enable OAuth debugging
logging.level.root=WARN
logging.level.com.example.backend=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG
logging.level.org.springframework.web=WARN

# CORS Configuration - Restrict to production domain
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://your-production-domain.com}
