# ====================================
# PRODUCTION ENVIRONMENT CONFIGURATION
# ====================================
# This file is used when spring.profiles.active=prod
# Uses environment variables for security - DO NOT hardcode secrets here

# Azure AD Configuration - From Environment Variables
azure.ad.tenant-id=${AZURE_TENANT_ID}
azure.ad.client-id=${AZURE_CLIENT_ID}
azure.ad.client-secret=${AZURE_CLIENT_SECRET}
azure.ad.authority=https://login.microsoftonline.com/${azure.ad.tenant-id}

# Dynamics 365 Configuration - From Environment Variables
d365.api.base-url=${D365_BASE_URL}
d365.api.scope=${D365_SCOPE}
d365.api.timeout=30000

# Production Logging - Less verbose
logging.level.root=WARN
logging.level.com.example.backend=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN

# CORS Configuration - Restrict to production domain
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://your-production-domain.com}
