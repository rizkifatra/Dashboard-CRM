services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm-backend
    ports:
      - "8080:8080"
    environment:
      # Azure AD Configuration (for OAuth2)
      - AZURE_TENANT_ID=${AZURE_TENANT_ID}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET}
      # Dynamics 365 Configuration
      - D365_TENANT_ID=${D365_TENANT_ID}
      - D365_CLIENT_ID=${D365_CLIENT_ID}
      - D365_CLIENT_SECRET=${D365_CLIENT_SECRET}
      - D365_BASE_URL=${D365_BASE_URL}
      - D365_SCOPE=${D365_SCOPE}
      # JWT Configuration
      - JWT_SECRET=${JWT_SECRET}
      # Frontend URL (for OAuth2 redirect)
      - FRONTEND_URL=http://localhost
      # CORS Configuration
      - CORS_ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://frontend
      # Spring Profile
      - SPRING_PROFILES_ACTIVE=prod
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/api/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - crm-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crm-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:80/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - crm-network

networks:
  crm-network:
    driver: bridge
